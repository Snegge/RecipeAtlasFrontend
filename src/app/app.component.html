<a class="skip-link" href="#main">Skip to content</a>
<header class="app-header">
  <div class="header-inner">
    <a class="brand" routerLink="/cookbooks" aria-label="Recipoke home">
      <span class="brand-mark"><app-icon name="book" /></span><span>Recipoke</span>
    </a>
    @if (auth.signedIn()) {
      <nav class="account-navigation" aria-label="Account navigation">
        <a mat-button routerLink="/cookbooks">Cookbooks</a
        ><a mat-button routerLink="/account">Account</a>
        @if (auth.user()?.isAdministrator) {
          <a mat-button routerLink="/admin">Accounts</a>
        }
      </nav>
    }
    @if (auth.signedIn() && !isEditor()) {
      <button
        mat-button
        (click)="logout()"
        [disabled]="leaving()"
        class="signout"
        [class.hide-signout-mobile]="showRecipesBack()"
      >
        <app-icon name="logout" /><span>Sign out</span>
      </button>
    }
    @if (showRecipesBack()) {
      <a
        mat-icon-button
        [routerLink]="
          cookbooks.current() ? ['/cookbooks', cookbooks.current()!.id, 'recipes'] : ['/cookbooks']
        "
        class="mobile-recipes-back"
        aria-label="Back to all recipes"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </a>
    }
  </div>
</header>
<main id="main" tabindex="-1"><router-outlet /></main>
