<a class="skip-link" href="#main">Skip to content</a>
<header class="app-header">
  <div class="header-inner">
    <a class="brand" routerLink="/recipes" aria-label="Recipe Atlas home">
      <span class="brand-mark"><app-icon name="book" /></span><span>Recipe Atlas</span>
    </a>
    @if (auth.signedIn() && !isEditor()) {
      <button mat-button (click)="logout()" [disabled]="leaving()" class="signout" [class.hide-signout-mobile]="showRecipesBack()">
        <app-icon name="logout" /><span>Sign out</span>
      </button>
    }
    @if (showRecipesBack()) {
      <a
        mat-icon-button
        routerLink="/recipes"
        class="mobile-recipes-back"
        aria-label="Back to all recipes"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </a>
    }
  </div>
</header>
<main id="main" tabindex="-1"><router-outlet /></main>
