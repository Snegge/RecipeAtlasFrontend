<section class="login-layout">
  <div class="login-card">
    <div class="large-mark"><mat-icon svgIcon="book" /></div>
    <div class="desktop-page-intro">
      <p class="eyebrow">YOUR PERSONAL RECIPE BOOK</p>
      <h1>Welcome to your kitchen.</h1>
      <p class="muted">Sign in to find a favorite or save something new.</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="login()">
      <mat-form-field class="full-width"
        ><mat-label>Username</mat-label
        ><input
          matInput
          formControlName="username"
          autocomplete="username"
          maxlength="32"
          required
        /><mat-error>Enter your username.</mat-error></mat-form-field
      >
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input
          matInput
          [type]="visible() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          maxlength="256"
          required
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="visible.set(!visible())"
          [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="visible()"
        >
          <mat-icon svgIcon="eye" />
        </button>
        <mat-error>Enter your password.</mat-error>
      </mat-form-field>
      @if (error()) {
        <p class="error-box" role="alert">{{ error() }}</p>
      }
      <button mat-flat-button class="full-width login-submit" [disabled]="busy()" type="submit">
        @if (busy()) {
          <mat-spinner diameter="20" />
        } @else {
          <span>Sign in</span>
        }
      </button>
    </form>
    <p class="login-footer">
      <mat-icon svgIcon="lock" /> Invitation-only accounts. Cookbooks you choose to share.
    </p>
  </div>
</section>
