<section aria-labelledby="method-heading">
  <div class="section-heading">
    <h2 id="method-heading">Method</h2>

    <span class="muted small">
      {{ steps.length }} / 100
    </span>
  </div>

  <div class="step-list">
    @for (
      step of steps.controls;
      track step;
      let index = $index
    ) {
      <div class="step-card">
        <div class="step-card-header">
          <span class="step-title">
            Step {{ index + 1 }}
          </span>

          <button
            mat-icon-button
            type="button"
            class="remove-step"
            [attr.aria-label]="'Remove step ' + (index + 1)"
            [disabled]="busy || steps.length <= 1"
            (click)="removeStep(index)"
          >
            <app-icon name="close" />
          </button>
        </div>

        <mat-form-field
          appearance="outline"
          subscriptSizing="dynamic"
          class="step-field"
        >
          <mat-label>Instructions</mat-label>

          <textarea
            #stepInput
            matInput
            cdkTextareaAutosize
            [cdkAutosizeMinRows]="2"
            [formControl]="step"
            [readonly]="busy"
            [attr.aria-label]="'Instructions for step ' + (index + 1)"
            rows="2"
            maxlength="4000"
            required
            placeholder="What happens next?"
          ></textarea>

          <mat-error>
            Enter an instruction, up to 4,000 characters.
          </mat-error>
        </mat-form-field>
      </div>
    }
  </div>

  <button
    mat-stroked-button
    type="button"
    class="add-step-button"
    [disabled]="busy || steps.length >= 100"
    (click)="addStep()"
  >
    <app-icon name="plus" />
    Add step
  </button>
</section>
