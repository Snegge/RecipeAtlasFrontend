name: Verify frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run check:contracts
      - name: Test quantities, editor conflict review, photos, membership and sessions
        run: npm test
      - run: npm run build
